<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Mastery — The Interactive Handbook (95 Lessons)</title>
  <meta name="description" content="A modern, comprehensive interactive book covering Java from fundamentals to Java 21, multithreading, internals, and functional programming.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;

      /* Dark Theme (Default: Obsidian / One Dark Pro) */
      --bg-canvas: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1e293b;
      --bg-surface-hover: #26354a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.15);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-brand: #38bdf8;
      --accent-brand-glow: rgba(56, 189, 248, 0.18);
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --accent-purple: #a855f7;

      --code-bg: #0d121f;
      --code-border: #1e293b;
      --code-gutter-border: rgba(255, 255, 255, 0.07);
      --code-line-hover: rgba(56, 189, 248, 0.04);
      --line-num-color: #4b5563;

      /* Dark Syntax Token Colors */
      --tok-comment: #6b7280;
      --tok-keyword: #f43f5e;
      --tok-type: #38bdf8;
      --tok-method: #c084fc;
      --tok-string: #34d399;
      --tok-number: #fbbf24;
      --tok-literal: #f59e0b;
      --tok-annotation: #818cf8;
      --tok-operator: #f472b6;
      --tok-key: #38bdf8;
      --tok-tag: #f43f5e;
      --tok-attr: #c084fc;

      --sidebar-width: 340px;
      --header-height: 64px;
      --right-toc-width: 240px;
      --content-max-width: 920px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-surface-hover: #e2e8f0;
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.14);

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;

      --accent-brand: #0284c7;
      --accent-brand-glow: rgba(2, 132, 199, 0.12);

      --code-bg: #f8fafc;
      --code-border: #e2e8f0;
      --code-gutter-border: rgba(0, 0, 0, 0.08);
      --code-line-hover: rgba(2, 132, 199, 0.04);
      --line-num-color: #94a3b8;

      /* Light Syntax Token Colors */
      --tok-comment: #64748b;
      --tok-keyword: #e11d48;
      --tok-type: #0284c7;
      --tok-method: #7c3aed;
      --tok-string: #059669;
      --tok-number: #d97706;
      --tok-literal: #ea580c;
      --tok-annotation: #4f46e5;
      --tok-operator: #db2777;
      --tok-key: #0284c7;
      --tok-tag: #e11d48;
      --tok-attr: #7c3aed;

      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.65;
      overflow-x: hidden;
      display: flex;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.45);
    }

    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ==========================================================================
       SIDEBAR
       ========================================================================== */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 40;
      transition: transform var(--transition-normal);
    }

    .brand-section {
      padding: 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, var(--bg-surface-elevated) 0%, var(--bg-surface) 100%);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f97316 0%, #ef4444 50%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: var(--font-heading);
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--accent-brand);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .sidebar-search-box {
      padding: 14px 18px 10px;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 36px 9px 34px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: all var(--transition-fast);
    }

    #search-input:focus {
      border-color: var(--accent-brand);
      box-shadow: 0 0 0 3px var(--accent-brand-glow);
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      font-size: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .reading-progress-card {
      margin: 0 18px 12px;
      padding: 12px 14px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 6px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 999px;
    }

    .module-filter-bar {
      display: flex;
      gap: 6px;
      padding: 0 18px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .module-filter-bar::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
      font-weight: 500;
    }

    .filter-pill:hover, .filter-pill.active {
      color: var(--text-primary);
      border-color: var(--accent-brand);
      background: var(--bg-surface-hover);
    }

    #sidebar-lesson-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 24px;
    }

    .module-group {
      margin-bottom: 14px;
    }

    .module-header {
      padding: 8px 10px;
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-radius: 6px;
      transition: background var(--transition-fast);
      user-select: none;
    }

    .module-header:hover {
      background: var(--bg-surface-elevated);
    }

    .module-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .module-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .module-lesson-count {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      margin: 2px 0;
      border-radius: 7px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      text-decoration: none;
    }

    .lesson-item:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      transform: translateX(2px);
    }

    .lesson-item.active {
      background: var(--accent-brand-glow);
      color: var(--accent-brand);
      font-weight: 600;
      border-left: 3px solid var(--accent-brand);
    }

    .lesson-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
    }

    .lesson-id-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      min-width: 32px;
      font-weight: 500;
    }

    .lesson-item.active .lesson-id-badge {
      color: var(--accent-brand);
      font-weight: 600;
    }

    .lesson-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lesson-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .lesson-checkbox.checked {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: #fff;
    }

    /* ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== */
    #main-container {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-canvas);
    }

    #top-navbar {
      height: var(--header-height);
      min-height: var(--header-height);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 30;
    }

    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #sidebar-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 6px;
      transition: all var(--transition-fast);
    }
    #sidebar-toggle-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .breadcrumb-trail {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb-trail span.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .nav-btn:hover {
      color: var(--text-primary);
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .nav-btn.primary {
      background: var(--accent-brand);
      color: #fff;
      border-color: var(--accent-brand);
    }
    .nav-btn.primary:hover {
      filter: brightness(1.1);
    }

    .content-body-wrapper {
      flex: 1;
      display: flex;
      overflow-y: auto;
      scroll-behavior: smooth;
      position: relative;
    }

    #lesson-content-area {
      flex: 1;
      padding: 40px 48px 100px;
      max-width: var(--content-max-width);
      margin: 0 auto;
    }

    .lesson-header-card {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .lesson-meta-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .meta-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff;
    }

    .read-time-indicator {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #lesson-title {
      font-family: var(--font-heading);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .content-tab-group {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }

    .content-tab-btn {
      padding: 10px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-heading);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-fast);
    }

    .content-tab-btn:hover {
      color: var(--text-primary);
    }

    .content-tab-btn.active {
      color: var(--accent-brand);
      border-bottom-color: var(--accent-brand);
    }

    .tab-counter-badge {
      font-size: 10px;
      background: var(--bg-surface-elevated);
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       RICH MARKDOWN TYPOGRAPHY
       ========================================================================== */
    .markdown-body {
      font-size: 15.5px;
      color: var(--text-secondary);
      line-height: 1.75;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      line-height: 1.3;
      scroll-margin-top: 80px;
    }

    .markdown-body h1 { font-size: 26px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
    .markdown-body h2 { font-size: 21px; font-weight: 700; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 17px; font-weight: 600; }
    .markdown-body h4 { font-size: 15px; font-weight: 600; }

    .markdown-body p {
      margin-bottom: 1.25em;
    }

    .markdown-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.4em;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 0.5em;
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border-subtle);
      margin: 2.5em 0;
    }

    /* ==========================================================================
       PREMIUM SYNTAX HIGHLIGHTING & COLOR GRADING
       ========================================================================== */
    /* Inline code chip */
    .markdown-body code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.88em;
      padding: 3px 7px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 5px;
      color: #38bdf8;
      font-weight: 500;
      word-break: break-word;
    }
    [data-theme="light"] .markdown-body code:not(pre code) {
      background: rgba(2, 132, 199, 0.07);
      border: 1px solid rgba(2, 132, 199, 0.2);
      color: #0284c7;
    }

    /* Code Block Containers */
    .code-block-wrapper {
      position: relative;
      margin: 1.6em 0;
      border-radius: 10px;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] .code-block-wrapper {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.025);
      border-bottom: 1px solid var(--code-border);
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }

    .code-lang-tag {
      font-weight: 600;
      color: var(--accent-brand);
      background: var(--accent-brand-glow);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
    }

    .code-copy-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .code-copy-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--accent-brand);
    }

    .code-container-pre {
      padding: 14px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.65;
      color: #e2e8f0;
      background: transparent;
      margin: 0;
      tab-size: 4;
    }

    /* Line Numbers Gutter */
    .code-line {
      display: flex;
      min-height: 1.65em;
      transition: background var(--transition-fast);
    }

    .code-line:hover {
      background: var(--code-line-hover);
    }

    .line-num {
      width: 48px;
      min-width: 48px;
      text-align: right;
      padding-right: 16px;
      user-select: none;
      color: var(--line-num-color);
      font-size: 12px;
      font-family: var(--font-mono);
      border-right: 1px solid var(--code-gutter-border);
      margin-right: 16px;
      flex-shrink: 0;
    }

    .line-text {
      flex: 1;
      padding-right: 16px;
      white-space: pre;
    }

    /* SYNTAX TOKEN COLOR CLASSES */
    .tok-comment    { color: var(--tok-comment); font-style: italic; }
    .tok-keyword    { color: var(--tok-keyword); font-weight: 600; }
    .tok-type       { color: var(--tok-type); font-weight: 600; }
    .tok-method     { color: var(--tok-method); }
    .tok-string     { color: var(--tok-string); }
    .tok-number     { color: var(--tok-number); }
    .tok-literal    { color: var(--tok-literal); font-weight: 600; }
    .tok-annotation { color: var(--tok-annotation); font-weight: 500; }
    .tok-operator   { color: var(--tok-operator); }
    .tok-key        { color: var(--tok-key); font-weight: 600; }
    .tok-tag        { color: var(--tok-tag); font-weight: 600; }
    .tok-attr       { color: var(--tok-attr); }

    /* Tables */
    .table-container {
      overflow-x: auto;
      margin: 1.6em 0;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--bg-surface-elevated);
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-subtle);
    }

    .markdown-body td {
      padding: 10px 14px;

  <script>
    /* ==========================================================================
       SYNTAX HIGHLIGHTING & TOKENIZER ENGINE (Color Grading)
       ========================================================================== */
    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Helper to safely wrap tokens without crossing newline boundaries
    function wrapToken(className, text) {
      const segments = text.split('\n');
      return segments.map(seg => seg ? `<span class="${className}">${escapeHtml(seg)}</span>` : '').join('\n');
    }

    function highlightJava(code) {
      const tokenRegex = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|(\b(?:true|false|null)\b)|(\b(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|exports|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|module|native|new|non-sealed|open|opens|package|permits|private|protected|provides|public|record|requires|return|sealed|short|static|strictfp|super|switch|synchronized|this|throw|throws|to|transient|transitive|try|uses|var|void|volatile|when|while|with|yield)\b)|(\b(?:0x[0-9a-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[fFdDlL]?)\b)|(\b[a-z_]\w*(?=\s*\())|(\b[A-Z]\w*\b)|(->|::|==|!=|<=|>=|&&|\|\||[+\-*\/%&|^!~=<>?:;.,]+)/g;

      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(code)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(code.slice(lastIndex, match.index));
        }

        if (match[1]) {
          result += wrapToken('tok-comment', match[1]);
        } else if (match[2]) {
          result += wrapToken('tok-string', match[2]);
        } else if (match[3]) {
          result += wrapToken('tok-annotation', match[3]);
        } else if (match[4]) {
          result += wrapToken('tok-literal', match[4]);
        } else if (match[5]) {
          result += wrapToken('tok-keyword', match[5]);
        } else if (match[6]) {
          result += wrapToken('tok-number', match[6]);
        } else if (match[7]) {
          result += wrapToken('tok-method', match[7]);
        } else if (match[8]) {
          result += wrapToken('tok-type', match[8]);
        } else if (match[9]) {
          result += wrapToken('tok-operator', match[9]);
        }

        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < code.length) {
        result += escapeHtml(code.slice(lastIndex));
      }

      return result;
    }

    function highlightJson(code) {
      const tokenRegex = /("(?:\\.|[^"\\])*")(?=\s*:)|("(?:\\.|[^"\\])*")|(\b(?:true|false|null)\b)|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(code)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(code.slice(lastIndex, match.index));
        }
        if (match[1]) {
          result += wrapToken('tok-key', match[1]);
        } else if (match[2]) {
          result += wrapToken('tok-string', match[2]);
        } else if (match[3]) {
          result += wrapToken('tok-literal', match[3]);
        } else if (match[4]) {
          result += wrapToken('tok-number', match[4]);
        }
        lastIndex = tokenRegex.lastIndex;
      }
      if (lastIndex < code.length) {
        result += escapeHtml(code.slice(lastIndex));
      }
      return result;
    }

    function highlightSql(code) {
      const tokenRegex = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\])*')|(\b(?:SELECT|FROM|WHERE|INSERT|INTO|UPDATE|DELETE|JOIN|INNER|LEFT|RIGHT|OUTER|FULL|ON|AND|OR|NOT|ORDER|BY|GROUP|HAVING|LIMIT|OFFSET|AS|CREATE|TABLE|DROP|ALTER|PRIMARY|KEY|FOREIGN|REFERENCES|DEFAULT|NULL|VALUES|SET|COUNT|SUM|AVG|MIN|MAX|DISTINCT|CASE|WHEN|THEN|ELSE|END|ASC|DESC)\b)/gi;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(code)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(code.slice(lastIndex, match.index));
        }
        if (match[1]) {
          result += wrapToken('tok-comment', match[1]);
        } else if (match[2]) {
          result += wrapToken('tok-string', match[2]);
        } else if (match[3]) {
          result += wrapToken('tok-keyword', match[3]);
        }
        lastIndex = tokenRegex.lastIndex;
      }
      if (lastIndex < code.length) {
        result += escapeHtml(code.slice(lastIndex));
      }
      return result;
    }

    function highlightXml(code) {
      const tokenRegex = /(<!--[\s\S]*?-->)|(<\/?[a-zA-Z0-9:-]+)|(\s+[a-zA-Z0-9:-]+(?==))|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g;
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(code)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(code.slice(lastIndex, match.index));
        }
        if (match[1]) {
          result += wrapToken('tok-comment', match[1]);
        } else if (match[2]) {
          result += wrapToken('tok-tag', match[2]);
        } else if (match[3]) {
          result += wrapToken('tok-attr', match[3]);
        } else if (match[4]) {
          result += wrapToken('tok-string', match[4]);
        }
        lastIndex = tokenRegex.lastIndex;
      }
      if (lastIndex < code.length) {
        result += escapeHtml(code.slice(lastIndex));
      }
      return result;
    }

    function highlightSyntax(rawCode, lang) {
      const language = (lang || 'java').toLowerCase();
      let highlighted = '';
      if (language === 'json') {
        highlighted = highlightJson(rawCode);
      } else if (language === 'sql') {
        highlighted = highlightSql(rawCode);
      } else if (language === 'html' || language === 'xml') {
        highlighted = highlightXml(rawCode);
      } else {
        highlighted = highlightJava(rawCode);
      }

      // Format with line numbers gutter
      const lines = highlighted.split('\n');
      return lines.map((lineContent, index) => {
        return `<div class="code-line"><span class="line-num">${index + 1}</span><span class="line-text">${lineContent || ' '}</span></div>`;
      }).join('');
    }

    /* ==========================================================================
       MARKDOWN PARSER
       ========================================================================== */
    function slugify(text) {
      return text.toLowerCase()
        .replace(/<[^>]*>/g, '')
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    // Global raw code storage for copy operations
    window.CODE_REGISTRY = {};
    let codeCounter = 0;

    function renderMarkdown(md) {
      if (!md) return '<p class="text-muted">No content available for this section.</p>';
      
      let html = md;
      html = html.replace(/\r\n/g, '\n');

      // GitHub alerts blockquotes: > [!NOTE], > [!TIP], > [!WARNING], > [!IMPORTANT]
      html = html.replace(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*\n((?:>.*(?:\n|$))*)/gim, function(match, type, content) {
        const cleanContent = content.replace(/^>\s?/gm, '').trim();
        const lowerType = type.toLowerCase();
        let borderClass = lowerType === 'warning' || lowerType === 'caution' ? 'warning' : (lowerType === 'tip' ? 'tip' : '');
        return `<div class="alert-card ${borderClass}"><div class="alert-title">${type}</div><p>${cleanContent}</p></div>\n`;
      });

      // Standard blockquotes
      html = html.replace(/^>\s*(.+)$/gm, '<blockquote><p>$1</p></blockquote>');

      // Fenced Code Blocks with syntax color grading and line numbering
      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const rawCode = code.trim();
        const displayLang = lang ? lang.toLowerCase() : 'java';
        const codeId = 'code_block_' + (++codeCounter);
        window.CODE_REGISTRY[codeId] = rawCode;

        const highlightedBody = highlightSyntax(rawCode, displayLang);

        return `
          <div class="code-block-wrapper">
            <div class="code-block-header">
              <span class="code-lang-tag">${displayLang.toUpperCase()}</span>
              <button class="code-copy-btn" onclick="copyCodeById('${codeId}', this)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copy
              </button>
            </div>
            <pre class="code-container-pre"><code>${highlightedBody}</code></pre>
          </div>
        `;
      });

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headings with IDs for TOC
      html = html.replace(/^### (.*$)/gim, function(match, title) {
        const id = slugify(title);
        return `<h3 id="${id}">${title}</h3>`;
      });
      html = html.replace(/^## (.*$)/gim, function(match, title) {
        const id = slugify(title);
        return `<h2 id="${id}">${title}</h2>`;
      });
      html = html.replace(/^# (.*$)/gim, function(match, title) {
        const id = slugify(title);
        return `<h1 id="${id}">${title}</h1>`;
      });

      // Bold & Italic
      html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Horizontal Rules
      html = html.replace(/^---$/gm, '<hr>');

      // Tables
      html = html.replace(/((?:\|[^\n]+\|\n?)+)/g, function(tableText) {
        const lines = tableText.trim().split('\n').filter(l => l.trim().startsWith('|'));
        if (lines.length < 2) return tableText;
        
        let headerRow = lines[0];
        let alignRow = lines[1];
        let bodyRows = lines.slice(2);

        if (!alignRow.includes('---')) return tableText;

        const parseRow = (r, isTh) => {
          const cells = r.split('|').slice(1, -1).map(c => c.trim());
          const tag = isTh ? 'th' : 'td';
          return '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
        };

        const ths = parseRow(headerRow, true);
        const tds = bodyRows.map(r => parseRow(r, false)).join('');

        return `<div class="table-container"><table><thead>${ths}</thead><tbody>${tds}</tbody></table></div>`;
      });

      // Unordered lists
      html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');

      // Ordered lists
      html = html.replace(/^\s*\d+\.\s+(.*)$/gm, '<li>$1</li>');

      // Paragraphs
      html = html.split('\n\n').map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<h') || p.startsWith('<div') || p.startsWith('<ul') || p.startsWith('<ol') || p.startsWith('<blockquote') || p.startsWith('<table') || p.startsWith('<hr')) {
          return p;
        }
        return `<p>${p}</p>`;
      }).join('\n');

      return html;
    }

    /* ==========================================================================
       APPLICATION LOGIC & STATE
       ========================================================================== */
    const state = {
      lessons: window.JAVA_BOOK_DATA ? window.JAVA_BOOK_DATA.lessons : [],
      modules: window.JAVA_BOOK_DATA ? window.JAVA_BOOK_DATA.modules : [],
      currentLessonIndex: 0,
      activeTab: 'guide',
      activeModuleFilter: 'all',
      searchQuery: '',
      completedLessons: JSON.parse(localStorage.getItem('java_book_completed') || '{}')
    };

    // DOM Elements
    const sidebarLessonList = document.getElementById('sidebar-lesson-list');
    const searchInput = document.getElementById('search-input');
    const progressFill = document.getElementById('progress-fill');
    const progressPercentLabel = document.getElementById('progress-percent-label');
    const lessonTitle = document.getElementById('lesson-title');
    const badgeModuleName = document.getElementById('badge-module-name');
    const crumbModule = document.getElementById('crumb-module');
    const crumbLesson = document.getElementById('crumb-lesson');
    const readTimeText = document.getElementById('read-time-text');
    const guideMarkdownContent = document.getElementById('guide-markdown-content');
    const questionsMarkdownContent = document.getElementById('questions-markdown-content');
    const answersContainer = document.getElementById('answers-container');
    const ansCounterBadge = document.getElementById('ans-counter-badge');
    const prevLessonCard = document.getElementById('prev-lesson-card');
    const nextLessonCard = document.getElementById('next-lesson-card');
    const prevLessonTitle = document.getElementById('prev-lesson-title');
    const nextLessonTitle = document.getElementById('next-lesson-title');
    const rightTocList = document.getElementById('right-toc-list');
    const btnMarkCompleted = document.getElementById('btn-mark-completed');
    const markBtnText = document.getElementById('mark-btn-text');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
    const sidebar = document.getElementById('sidebar');

    function initApp() {
      const savedTheme = localStorage.getItem('java_book_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const foundIdx = state.lessons.findIndex(l => l.id === hash || l.title.toLowerCase().includes(hash.toLowerCase()));
        if (foundIdx !== -1) {
          state.currentLessonIndex = foundIdx;
        }
      }

      renderSidebar();
      loadLesson(state.currentLessonIndex);
      updateProgress();
      setupEventListeners();
    }

    function renderSidebar() {
      sidebarLessonList.innerHTML = '';

      state.modules.forEach(mod => {
        if (state.activeModuleFilter !== 'all' && state.activeModuleFilter !== String(mod.id)) {
          return;
        }

        const modLessons = state.lessons.filter(l => l.moduleId === mod.id);
        const filteredLessons = modLessons.filter(l => {
          if (!state.searchQuery) return true;
          const query = state.searchQuery.toLowerCase();
          return l.title.toLowerCase().includes(query) || l.id.toLowerCase().includes(query);
        });

        if (filteredLessons.length === 0) return;

        const group = document.createElement('div');
        group.className = 'module-group';

        const header = document.createElement('div');
        header.className = 'module-header';
        header.innerHTML = `
          <div class="module-header-title">
            <span class="module-indicator-dot" style="background-color: ${mod.color}"></span>
            <span>Module ${mod.id}: ${mod.badge}</span>
          </div>
          <span class="module-lesson-count">${filteredLessons.length}</span>
        `;

        const listContainer = document.createElement('div');
        listContainer.className = 'module-lesson-sublist';

        filteredLessons.forEach(lesson => {
          const globalIdx = state.lessons.indexOf(lesson);
          const isCurrent = globalIdx === state.currentLessonIndex;
          const isDone = !!state.completedLessons[lesson.id];

          const item = document.createElement('div');
          item.className = `lesson-item ${isCurrent ? 'active' : ''}`;
          item.setAttribute('data-index', globalIdx);
          item.innerHTML = `
            <div class="lesson-item-left">
              <span class="lesson-id-badge">${lesson.id}</span>
              <span class="lesson-item-title">${lesson.title}</span>
            </div>
            <div class="lesson-checkbox ${isDone ? 'checked' : ''}" title="Mark completed" onclick="toggleComplete('${lesson.id}', event)">
              ${isDone ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
            </div>
          `;

          item.addEventListener('click', (e) => {
            if (e.target.closest('.lesson-checkbox')) return;
            state.currentLessonIndex = globalIdx;
            loadLesson(globalIdx);
            renderSidebar();
            if (window.innerWidth <= 768) {
              sidebar.classList.remove('open');
            }
          });

          listContainer.appendChild(item);
        });

        group.appendChild(header);
        group.appendChild(listContainer);
        sidebarLessonList.appendChild(group);
      });
    }

    function loadLesson(index) {
      if (index < 0 || index >= state.lessons.length) return;
      state.currentLessonIndex = index;
      const lesson = state.lessons[index];

      history.replaceState(null, null, `#${lesson.id}`);

      lessonTitle.textContent = lesson.title;
      badgeModuleName.textContent = `Module ${lesson.moduleId} • ${lesson.moduleBadge}`;
      badgeModuleName.style.backgroundColor = lesson.moduleColor;
      crumbModule.textContent = `Module ${lesson.moduleId}: ${lesson.moduleName}`;
      crumbLesson.textContent = `${lesson.id} ${lesson.title}`;

      const wordCount = (lesson.content.split(/\s+/).length);
      const estMinutes = Math.max(3, Math.ceil(wordCount / 180));
      readTimeText.textContent = `${estMinutes} min read`;

      guideMarkdownContent.innerHTML = renderMarkdown(lesson.content);

      if (lesson.questions && lesson.questions.trim()) {
        questionsMarkdownContent.innerHTML = renderMarkdown(lesson.questions);
      } else {
        questionsMarkdownContent.innerHTML = '<p class="text-muted">No specific interview challenge document recorded for this lesson.</p>';
      }

      // Render Code Solutions with color grading and line numbering
      ansCounterBadge.textContent = lesson.answers.length;
      if (lesson.answers && lesson.answers.length > 0) {
        document.getElementById('tab-btn-answers').style.display = 'flex';
        answersContainer.innerHTML = lesson.answers.map(ans => {
          const codeId = 'ans_block_' + (++codeCounter);
          window.CODE_REGISTRY[codeId] = ans.code;
          const highlightedJava = highlightSyntax(ans.code, 'java');

          return `
            <div class="code-solution-panel">
              <div class="code-solution-header">
                <span class="file-name-tag">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                  </svg>
                  ${ans.filename}
                </span>
                <button class="code-copy-btn" onclick="copyCodeById('${codeId}', this)">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  Copy Java Code
                </button>
              </div>
              <pre class="code-container-pre"><code>${highlightedJava}</code></pre>
            </div>
          `;
        }).join('');
      } else {
        answersContainer.innerHTML = `
          <div class="alert-card">
            <div class="alert-title">Concepts Lesson</div>
            <p>This lesson focuses on theoretical JVM architecture, syntax foundations, or configuration. Direct answer files are not required for this topic.</p>
          </div>
        `;
      }

      updateCompletedBtn(lesson.id);

      if (index > 0) {
        const prev = state.lessons[index - 1];
        prevLessonCard.style.visibility = 'visible';
        prevLessonTitle.textContent = `${prev.id} ${prev.title}`;
        prevLessonCard.onclick = () => { loadLesson(index - 1); renderSidebar(); };
      } else {
        prevLessonCard.style.visibility = 'hidden';
      }

      if (index < state.lessons.length - 1) {
        const next = state.lessons[index + 1];
        nextLessonCard.style.visibility = 'visible';
        nextLessonTitle.textContent = `${next.id} ${next.title}`;
        nextLessonCard.onclick = () => { loadLesson(index + 1); renderSidebar(); };
      } else {
        nextLessonCard.style.visibility = 'hidden';
      }

      buildOnPageTOC();
      document.getElementById('content-body-wrapper').scrollTop = 0;
    }

    function buildOnPageTOC() {
      rightTocList.innerHTML = '';
      const activePane = document.querySelector('.tab-pane.active');
      if (!activePane) return;

      const headings = activePane.querySelectorAll('h2, h3');
      if (headings.length === 0) {
        rightTocList.innerHTML = '<li class="text-muted" style="font-size: 12px;">No subheadings in this section</li>';
        return;
      }

      headings.forEach(h => {
        const li = document.createElement('li');
        li.className = 'right-toc-item';
        if (h.tagName === 'H3') li.style.paddingLeft = '12px';

        const a = document.createElement('a');
        a.className = 'right-toc-link';
        a.href = `#${h.id}`;
        a.textContent = h.textContent;
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
        };

        li.appendChild(a);
        rightTocList.appendChild(li);
      });
    }

    window.toggleComplete = function(lessonId, event) {
      if (event) event.stopPropagation();
      if (state.completedLessons[lessonId]) {
        delete state.completedLessons[lessonId];
      } else {
        state.completedLessons[lessonId] = true;
      }
      localStorage.setItem('java_book_completed', JSON.stringify(state.completedLessons));
      updateProgress();
      updateCompletedBtn(state.lessons[state.currentLessonIndex].id);
      renderSidebar();
    };

    function updateCompletedBtn(lessonId) {
      const isDone = !!state.completedLessons[lessonId];
      if (isDone) {
        btnMarkCompleted.classList.add('primary');
        markBtnText.textContent = 'Completed ✓';
      } else {
        btnMarkCompleted.classList.remove('primary');
        markBtnText.textContent = 'Mark as Read';
      }
    }

    function updateProgress() {
      const completedCount = Object.keys(state.completedLessons).length;
      const total = state.lessons.length;
      const pct = Math.round((completedCount / total) * 100);
      progressFill.style.width = `${pct}%`;
      progressPercentLabel.textContent = `${completedCount}/${total} (${pct}%)`;
    }

    // Copy exact raw code using stored registry ID (avoids copying line numbers)
    window.copyCodeById = function(codeId, btn) {
      const rawCode = window.CODE_REGISTRY[codeId];
      if (!rawCode) return;
      navigator.clipboard.writeText(rawCode).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Copied!';
        btn.style.color = '#10b981';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.color = '';
        }, 1800);
      });
    };

    function setupEventListeners() {
      document.querySelectorAll('.content-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.content-tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

          btn.classList.add('active');
          const tabId = btn.getAttribute('data-tab');
          state.activeTab = tabId;
          document.getElementById(`pane-${tabId}`).classList.add('active');
          buildOnPageTOC();
        });
      });

      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          state.activeModuleFilter = pill.getAttribute('data-mod');
          renderSidebar();
        });
      });

      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value.trim();
        renderSidebar();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      btnMarkCompleted.addEventListener('click', () => {
        const currentLesson = state.lessons[state.currentLessonIndex];
        toggleComplete(currentLesson.id);
      });

      themeToggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('java_book_theme', next);
      });

      sidebarToggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
